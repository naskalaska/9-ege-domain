  <style>

er,.connect-btn:hover,.sort-item:hover{border-color:#d4a843;background:#fff8dc}.selected{border-color:#d4a843!important;background:#fff1a8!important}.correct{border-color:#4a7c3f!important;background:#effaf0!important}.wrong{border-color:#c0392b!important;background:#fff1f1!important}.feedback{font-weight:700;margin-top:12px}.good{color:#14883b}.bad{color:#c0392b}.theory{margin-top:12px;background:#eef6ff;border-radius:12px;padding:12px;color:#334155;font-size:14px}.hidden{display:none!important}.highlight-option{display:inline-block;margin:2px;padding:2px 7px;border-radius:7px;border-bottom:2px dashed transparent;cursor:pointer}.highlight-option:hover{background:#fff3cd}.highlight-option.selected{font-weight:700;border-bottom-color:#d4a843}.highlight-option.locked{cursor:default}.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.sort-layout{display:grid;grid-template-columns:1fr;gap:16px}.sort-pool,.basket{min-height:92px;border:2px dashed #c4a87c;border-radius:18px;padding:12px;background:#fffaf0}.basket-title{font-weight:800;color:#8b5e3c;text-align:center;margin-bottom:8px}.basket-items{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.sort-item{display:inline-block;font-weight:700}.tools{margin:14px 0}.loader{background:#fff7e6;border:2px solid #d4a843;border-radius:18px;padding:18px}.file-input{display:block;margin-top:12px}.kbd{font-family:monospace;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:2px 5px}

    .connect-area{position:relative;padding:8px 0}.connect-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px}.connect-col{display:flex;flex-direction:column;gap:10px}.connect-col-title{text-align:center;color:#8b5e3c;font-weight:800;margin-bottom:2px}.match-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}.match-path{fill:none;stroke:#2c6f8c;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 2px 2px rgba(44,111,140,.18))}.match-path.preview{stroke:#d4a843;stroke-dasharray:7 6}.connect-btn{position:relative;text-align:left;min-height:58px}.connect-btn.left{text-align:right}.connect-btn.connected{background:#eef8ff;border-color:#2c6f8c}.connect-btn.selected{box-shadow:0 0 0 3px rgba(212,168,67,.22)}.choice-label{display:block;color:#2c6f8c;font-size:12px;margin-top:5px}
    @media(max-width:700px){.connect-grid{grid-template-columns:1fr;gap:24px}.match-lines{display:none}.connect-btn.left{text-align:left}.question{font-size:18px}.text-box{font-size:18px}.app{padding:12px}.zone{padding:13px}}
  </style>
  <style>
    body{
      background-image:linear-gradient(rgba(25,45,24,.10),rgba(25,45,24,.10)),url('assets/фон общий.png');
      background-size:cover;background-position:center;background-attachment:fixed;

    body.arena-screen{

      background-size:cover;background-position:center;background-attachment:fixed;
    }
    .app{max-width:1180px;min-height:100vh}.top{padding:12px 16px;background:rgba(255,250,232,.88);border:2px solid rgba(113,72,27,.62);border-radius:20px;box-shadow:0 8px 24px rgba(42,31,14,.18);backdrop-filter:blur(7px)}
    .zone{background:rgba(255,249,224,.68);border-color:#9b682d;backdrop-filter:blur(3px)}

    .card{position:relative;isolation:isolate;min-height:220px;padding:0;overflow:hidden;border:3px solid #b5843f;background-image:linear-gradient(to top,rgba(20,15,8,.88) 0,rgba(20,15,8,.34) 44%,rgba(20,15,8,.02) 72%),var(--card-bg);background-size:cover;background-position:center;box-shadow:0 10px 22px rgba(44,30,12,.28)}

    .card h3,.card .muted,.card .progress{position:absolute;z-index:2;left:14px;right:14px}.card h3{bottom:94px;margin:0;color:#fff;font-size:22px;line-height:1.08;max-height:52px;overflow:hidden;text-shadow:0 2px 5px #000}.card .muted{bottom:43px;min-height:40px;margin:0;color:#fff0c5;font-size:16px;line-height:1.16;font-weight:800;text-shadow:0 1px 4px #000}.card .progress{left:12px;right:12px;bottom:17px;height:14px;background:rgba(255,247,220,.34);border-color:rgba(255,255,255,.64);box-shadow:inset 0 1px 3px rgba(47,28,8,.35),0 2px 5px rgba(0,0,0,.16)}
    .card .fill{background:linear-gradient(90deg,#5d8d43,#9ac55f 68%,#f4d86d);box-shadow:inset 0 1px 0 rgba(255,255,255,.42)}

    .card.completed{border-color:#f6cf62;box-shadow:0 0 0 4px rgba(255,225,124,.34),0 14px 28px rgba(42,27,8,.36)}.card.completed h3,.card.completed .muted{right:36%}
    .card[data-subtopic="train"]{grid-column:1/-1;min-height:320px;background-position:center 42%}.card[data-subtopic="train"] h3{bottom:98px;font-size:28px}.card[data-subtopic="train"].completed .card-character{max-height:96%;max-width:30%;right:5%}
    .task{isolation:isolate;border:0;border-radius:32px;padding:clamp(30px,4vw,48px) clamp(42px,5vw,64px);background:none;box-shadow:none;min-height:0}
    .task::before{content:"";position:absolute;inset:0;border-radius:32px;background:url('assets/подложка_под_задание.png') center/100% 100% no-repeat;opacity:.80;z-index:-2;pointer-events:none;filter:drop-shadow(0 15px 24px rgba(28,18,8,.32))}
    .task::after{content:"";position:absolute;inset:25px 34px;border-radius:22px;background:rgba(255,250,232,.14);z-index:-1;pointer-events:none}
    .task.correct,.task.wrong{background-color:transparent!important}.drawing-toolbar.collapsed{visibility:hidden;pointer-events:none}
    .question{font-family:Georgia,'Times New Roman',serif;color:#49321b;font-weight:700}
    .text-box,.option,.category,.connect-btn,.sort-item,.answer-input{border:2px solid #c99b52;background-color:#fff9e8;background-image:linear-gradient(rgba(255,251,235,.82),rgba(255,248,224,.82)),url('assets/карточки для заданий.png');background-size:calc(100% + 34px) calc(100% + 28px);background-position:center;color:#3b2a19;box-shadow:0 4px 10px rgba(81,50,17,.11)}
    .text-box.reading-text{background-image:none;background-color:rgba(255,249,232,.62);border:1px solid rgba(153,104,45,.42);box-shadow:none;padding:18px 20px}
    .section-progress{width:100%;margin:-3px 0 26px 0;height:18px;background:rgba(255,250,232,.82);border:2px solid rgba(139,94,60,.70);box-shadow:inset 0 2px 5px rgba(64,37,11,.22),0 5px 12px rgba(42,31,14,.12)}
    .option:hover,.category:hover,.connect-btn:hover,.sort-item:hover{background-color:#fff3c8;border-color:#9c6a26;transform:translateY(-1px)}
    .fact-box{background:#f5efd5;border-color:#6f8a3b;color:#3f472b}
    .theory{margin-top:18px;padding:16px 18px;background:#fff2c9;border:2px solid #c69443;border-left:7px solid #739247;border-radius:15px;color:#4d351d;font-size:15px;line-height:1.55;box-shadow:0 5px 12px rgba(74,46,15,.13)}
    .theory-overlay{position:fixed;inset:0;z-index:900;display:grid;place-items:start center;padding:2vh 12px;background:rgba(23,17,10,.66);backdrop-filter:blur(6px);overflow:auto}
    .theory-sheet{position:relative;width:min(920px,96vw,calc(94vh * 1.368));aspect-ratio:1315/961;flex:none;background:transparent url('assets/карточка под теорию.png') center/100% 100% no-repeat;filter:drop-shadow(0 18px 28px rgba(0,0,0,.42));animation:theory-drop .34s cubic-bezier(.2,.8,.25,1) both}
    .theory-sheet-title{position:absolute;left:28%;right:25%;top:13%;height:11%;display:grid;place-items:center;margin:0;text-align:center;color:#583a19;font-family:Georgia,'Times New Roman',serif;font-size:clamp(20px,3vw,30px);line-height:1.05}
    .theory-sheet-body{position:absolute;left:11%;right:10%;top:29%;bottom:9%;overflow:auto;padding:4px 12px;color:#4d351d;font-family:Georgia,'Times New Roman',serif;font-size:clamp(15px,1.8vw,19px);line-height:1.68;white-space:pre-wrap}.theory-sheet-body p{margin:0}
    .theory-sheet.has-image .theory-sheet-body{top:24%;bottom:8%;display:grid;place-items:center;white-space:normal}
    .theory-image-button{display:block;width:100%;border:0;padding:0;background:transparent;cursor:zoom-in}
    .theory-image-button img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;border-radius:10px}
    .theory-image-button.zoomed{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:rgba(15,10,5,.86);cursor:zoom-out}
    .theory-image-button.zoomed img{width:auto;max-width:96vw;max-height:96vh;box-shadow:0 18px 40px rgba(0,0,0,.55)}
    .theory-close{position:absolute;z-index:2;right:5%;top:5%;width:44px;height:44px;border:2px solid #8c5f29;border-radius:50%;background:#fff3cf;color:#603b17;font-size:28px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 4px 9px rgba(73,43,12,.25)}.theory-close:hover{background:#ffe29a;transform:scale(1.06)}
    .asset-button{width:74px;height:68px;padding:0;border:0;background-color:transparent;background-repeat:no-repeat;background-position:center;background-size:contain;filter:drop-shadow(0 4px 4px rgba(66,42,16,.3));cursor:pointer;transition:transform .16s,filter .16s;text-indent:-9999px;overflow:hidden}
    .asset-button:hover{transform:translateY(-3px) rotate(-2deg);filter:drop-shadow(0 7px 5px rgba(66,42,16,.36))}.asset-button:focus-visible{outline:4px solid #2c6f8c;outline-offset:2px;border-radius:16px}.theory-button{background-image:url('assets/кнопка теория.png')}.pencil-button{background-image:url('assets/кнопка_карандаш.png')}
    .drawing-toolbar{background:rgba(255,248,220,.94);border-color:#b8873c}.badge{background:#f4d98e;border:1px solid #a47731}
    .sort-pool{background:rgba(255,250,229,.70);border-color:#a6793e}.basket{position:relative;min-height:190px;padding:10px 10px 14px;border:0;background:rgba(255,251,232,.66);box-shadow:inset 0 0 0 2px rgba(153,104,45,.34);overflow:hidden}.basket:hover{box-shadow:inset 0 0 0 3px #d4a843;background:rgba(255,247,210,.78)}
    .basket-food{display:block;width:116px;height:86px;margin:0 auto 2px;object-fit:contain;filter:drop-shadow(0 5px 4px rgba(54,36,17,.25));pointer-events:none}.basket-title{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:14px}.basket-items{position:relative;z-index:2}.basket .sort-item{font-size:13px;padding:8px}
    .completion-panel{position:relative;min-height:600px;padding:clamp(90px,14vw,155px) clamp(60px,13vw,175px);text-align:center;background:transparent url('assets/финальная заглушка.png') center/100% 100% no-repeat;border:0;box-shadow:none}.completion-panel h2{font-family:Georgia,'Times New Roman',serif;color:#583a19;font-size:clamp(24px,4vw,40px);margin:0 0 12px}.completion-character{position:absolute;right:7%;bottom:5%;height:42%;max-width:30%;object-fit:contain;filter:drop-shadow(0 8px 7px rgba(0,0,0,.28))}
    .overall-stats,.stats-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}.overall-stats{background:rgba(255,250,232,.80);border:2px solid rgba(139,94,60,.62);border-radius:18px;padding:12px;box-shadow:0 8px 20px rgba(42,31,14,.12)}.stat-pill{min-width:130px;padding:12px 16px;border-radius:16px;background:rgba(255,250,232,.76);border:2px solid #d4a843;color:#49321b;font-weight:800}.stat-pill.good{border-color:#4a7c3f}.stat-pill.bad{border-color:#c0392b}.stat-pill.skip{border-color:#8b5e3c}
    .task-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin:-10px 0 18px;padding:12px;background:rgba(255,250,232,.82);border:2px solid rgba(139,94,60,.55);border-radius:18px}.task-nav-title{font-weight:800;color:#583a19;margin-right:4px}.task-dot{width:34px;height:34px;display:grid;place-items:center;border:2px solid #b8873c;border-radius:50%;background:#fff8dc;color:#583a19;font-weight:800;cursor:pointer}.task-dot:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(74,46,15,.16)}.task-dot.current{outline:3px solid rgba(44,111,140,.25);border-color:#2c6f8c}.task-dot.correct{background:#effaf0!important;border-color:#4a7c3f!important}.task-dot.wrong{background:#fff1f1!important;border-color:#c0392b!important}.task-dot.skipped{background:#fff2c9!important;border-color:#8b5e3c!important}.task-dot.pending{opacity:.78}
    .completion-medals{position:absolute;left:13.5%;right:14.5%;bottom:11.1%;display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(14px,3vw,34px);align-items:center;pointer-events:none}.completion-medal{width:min(116px,12vw);aspect-ratio:1;margin:0 auto;border-radius:50%;display:grid;place-items:center;opacity:0}.completion-medal img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(70,43,15,.32))}.completion-medal.done{opacity:1;filter:drop-shadow(0 0 12px rgba(255,230,118,.92)) drop-shadow(0 0 22px rgba(246,207,98,.58))}
    .option,.category,.connect-btn,.sort-item,.answer-input,.basket-title{overflow-wrap:anywhere;word-break:normal;hyphens:auto}
    .answer-line{margin-top:10px;padding:10px 12px;background:rgba(255,250,232,.78);border:1px solid #d4a843;border-radius:12px;color:#49321b;line-height:1.45}
    .answer-effect{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;pointer-events:none;overflow:hidden}.answer-symbol{width:150px;height:150px;filter:drop-shadow(0 12px 12px rgba(0,0,0,.22))}.answer-effect.success .answer-symbol{animation:success-pop .72s cubic-bezier(.15,.88,.25,1.28) both}.answer-effect.error .answer-symbol{animation:error-wobble .62s ease both}.confetti{position:absolute;left:50%;top:50%;width:12px;height:24px;border-radius:3px;background:hsl(var(--hue) 85% 55%);transform:translate(-50%,-50%) rotate(var(--rot));animation:confetti-burst 1s ease-out forwards;animation-delay:var(--delay)}
    .task.answer-wrong{animation:task-shake .42s ease}.task.answer-correct{animation:task-glow .8s ease}
    @keyframes character-arrive{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:none}}
    @keyframes success-pop{0%{opacity:0;transform:scale(.35) rotate(-18deg)}65%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:0;transform:scale(1)}}
    @keyframes error-wobble{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:translateX(-14px) rotate(-8deg)}50%{transform:translateX(12px) rotate(7deg)}75%{transform:translateX(-7px) rotate(-4deg)}100%{opacity:0;transform:none}}
    @keyframes confetti-burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot))}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(calc(var(--rot) + 360deg))}}

      const tasks=state.data.tasks[id]||[];

        else if(status==='wrong') stats.wrong++;
        else if(status==='skipped') stats.skipped++;
        else stats.pending++;
        stats.total++;
        return stats;
      },{correct:0,wrong:0,skipped:0,pending:0,total:0});
    }

      const order=state.data.subtopicOrder || Object.keys(state.data.subtopics || {});

      if(!data || typeof data!=='object') throw new Error('Корень JSON должен быть объектом.');
      if(!data.subtopics || typeof data.subtopics!=='object') throw new Error('В JSON нет объекта subtopics.');
      if(!data.tasks || typeof data.tasks!=='object') throw new Error('В JSON нет объекта tasks.');

        if(!data.subtopics[id]) throw new Error(`Раздел ${id} отсутствует в subtopics.`);
        if(!Array.isArray(data.tasks[id])) throw new Error(`Для раздела ${id} нет массива tasks.`);

      }
      return data;
    }
    function taskLocation(section,index){ return `${section}, задание ${index+1}`; }
    function pairAnswer(pair){ return pair?.answer ?? pair?.right; }
    function validateTask(task,section,index){
      const where=taskLocation(section,index), fail=message=>{ throw new Error(`${where}: ${message}`); };
      if(!task || typeof task!=='object' || Array.isArray(task)) fail('задание должно быть объектом.');
      if(!['choose','highlight','classify','match','sort','input','select'].includes(task.type)) fail(`неизвестный тип «${task.type || ''}».`);
      if(typeof task.question!=='string' || !task.question.trim()) fail('не заполнен вопрос.');
      if(task.type==='choose'){
        if(!Array.isArray(task.options) || task.options.length<2) fail('нужно минимум два варианта ответа.');
        if(!Number.isInteger(task.answer) || task.answer<0 || task.answer>=task.options.length) fail('номер правильного варианта вне диапазона.');
      }
      if(task.type==='select'){
        if(!Array.isArray(task.items) || task.items.length<2) fail('нужно минимум два утверждения.');
        const hasMarked=task.items.some(item=>item && item.is_correct===true);
        const hasAnswers=Array.isArray(task.answers) && task.answers.length;
        if(!hasMarked && !hasAnswers) fail('не заданы правильные утверждения.');
      }
      if(task.type==='classify'){
        if(!Array.isArray(task.categories) || !task.categories.includes(task.answer)) fail('ответ отсутствует среди категорий.');
        if(typeof task.item!=='string' || !task.item.trim()) fail('не заполнен объект классификации.');
      }
      if(task.type==='highlight'){
        const marking=expectedMarking(task);
        if(typeof task.text!=='string' || !task.text.trim()) fail('не заполнен текст для разметки.');
        if(!['subject','predicate','main'].some(role=>Array.isArray(marking[role]) && marking[role].length)) fail('не заданы слова для разметки.');
      }
      if(task.type==='match'){
        if(!Array.isArray(task.pairs) || !task.pairs.length) fail('не заданы пары.');
        if(task.pairs.some(pair=>!pair || typeof pair.left!=='string' || pairAnswer(pair)===undefined)) fail('в паре должны быть поля left и answer/right.');
      }
      if(task.type==='sort'){
        if(!Array.isArray(task.categories) || !task.categories.length || !Array.isArray(task.items) || !task.items.length) fail('не заданы категории или карточки.');
        if(task.items.some(item=>!item || typeof item.text!=='string' || !task.categories.includes(item.answer))) fail('ответ карточки отсутствует среди категорий.');
      }
      if(task.type==='input'){
        const answers=Array.isArray(task.answers)?task.answers:(task.answer!==undefined?[task.answer]:[]);
        if(!answers.length) fail('не задан ни один допустимый ответ.');
      }
    }

    function curvedPath(x1,y1,x2,y2){
      const bend=Math.max(36,Math.abs(x2-x1)*.46);
      return `M ${x1} ${y1} C ${x1+bend} ${y1}, ${x2-bend} ${y2}, ${x2} ${y2}`;
    }
    function drawLines(){
      const svg=$('#matchLines'), area=$('#matchArea'); if(!svg||!area) return;
      svg.innerHTML=''; const ar=area.getBoundingClientRect();
      Object.entries(state.matchLinks).forEach(([leftIndex,rightIndex])=>{
        const l=$(`[data-left="${leftIndex}"]`), r=$(`[data-right-index="${rightIndex}"]`);
        if(!l||!r) return;
        const lr=l.getBoundingClientRect(), rr=r.getBoundingClientRect();
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('class','match-path');
        path.setAttribute('d',curvedPath(lr.right-ar.left,lr.top+lr.height/2-ar.top,rr.left-ar.left,rr.top+rr.height/2-ar.top));
        svg.appendChild(path);
      });
      if(state.selectedMatchLeft!==null && state.matchPointer){
        const left=$(`[data-left="${state.selectedMatchLeft}"]`); if(!left) return;
        const lr=left.getBoundingClientRect(), path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('class','match-path preview');
        path.setAttribute('d',curvedPath(lr.right-ar.left,lr.top+lr.height/2-ar.top,state.matchPointer.x,state.matchPointer.y));
        svg.appendChild(path);
      }
    }
    window.addEventListener('resize', drawLines);
    function requestAnswer(message){
      const f=$('#feedback'); if(f) f.innerHTML=`<span class="bad">${esc(message)}</span>`;
    }
    function lockTask(){
      state.locked=true;
      $('#checkBtn')?.setAttribute('disabled','');
      $('#skipBtn')?.setAttribute('disabled','');
      $$('#taskCard .option,#taskCard .category,#taskCard .connect-btn,#taskCard .sort-item').forEach(el=>{ el.disabled=true; el.draggable=false; });
      $$('#taskCard .highlight-option').forEach(el=>el.classList.add('locked'));
      const input=$('#answerInput'); if(input) input.disabled=true;
    }
    function currentHint(){
      const task=currentTask()||{};
      return task.theory||'Подсказка к этому заданию пока не добавлена.';
    }
    function answerText(task=currentTask()){
      if(!task) return 'Ответ не найден.';
      if(task.type==='choose') return (task.options||[])[task.answer] ?? '';
      if(task.type==='select'){
        const right=correctSelectNumbers(task);
        return right.length ? right.map(n=>`${n}. ${(task.items||[])[n-1]?.text || ''}`).join('; ') : 'Верные утверждения не заданы.';
      }
      if(task.type==='classify') return task.answer || '';
      if(task.type==='highlight'){
        const marking=expectedMarking(task), labels={subject:'подлежащее',predicate:'сказуемое',main:'главный член'};
        return ['subject','predicate','main'].filter(role=>(marking[role]||[]).length).map(role=>`${labels[role]}: ${(marking[role]||[]).join(' / ')}`).join('; ');
      }
      if(task.type==='sort') return (task.items||[]).map(item=>`${item.text}: ${item.answer}`).join('; ');
      if(task.type==='match') return (task.pairs||[]).map(pair=>`${pair.left}: ${pairAnswer(pair)}`).join('; ');
      if(task.type==='input') return (Array.isArray(task.answers)?task.answers:(task.answer!==undefined?[task.answer]:[])).join(' / ');
      return '';
    }
    function revealAnswer(){
      const th=$('#theory');
      if(!th) return;
      th.innerHTML=`<div class="answer-line"><b>Ответ:</b> ${rich(answerText())}</div><div class="answer-line"><b>Подсказка:</b> ${rich(currentHint())}</div>`;
      th.classList.remove('hidden');
    }
    function playAnswerEffect(ok){
      document.querySelector('.answer-effect')?.remove();
      const card=$('#taskCard');
      if(card){
        card.classList.remove('answer-correct','answer-wrong');
        void card.offsetWidth;
        card.classList.add(ok?'answer-correct':'answer-wrong');
      }
      const effect=document.createElement('div');
      effect.className=`answer-effect ${ok?'success':'error'}`;
      effect.setAttribute('aria-hidden','true');
      effect.innerHTML=ok
        ?`<svg class="answer-symbol" viewBox="0 0 160 160"><circle cx="80" cy="80" r="66" fill="#eaf9e9" stroke="#359a4c" stroke-width="10"/><path d="M43 82l24 25 52-58" fill="none" stroke="#27883e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>`
        :`<svg class="answer-symbol" viewBox="0 0 160 160"><circle cx="80" cy="80" r="66" fill="#fff0ed" stroke="#cf4b3f" stroke-width="10"/><path d="M52 52l56 56m0-56l-56 56" fill="none" stroke="#bd352e" stroke-width="14" stroke-linecap="round"/></svg>`;
      if(ok){
        for(let i=0;i<28;i++){
          const piece=document.createElement('i'), angle=(Math.PI*2*i)/28, distance=150+(i%5)*30;
          piece.className='confetti';
          piece.style.setProperty('--x',`${Math.cos(angle)*distance}px`);
          piece.style.setProperty('--y',`${Math.sin(angle)*distance}px`);
          piece.style.setProperty('--rot',`${i*37}deg`);
          piece.style.setProperty('--hue',String((i*49)%360));
          piece.style.setProperty('--delay',`${(i%4)*.035}s`);
          effect.appendChild(piece);
        }
      }
      document.body.appendChild(effect);
      setTimeout(()=>effect.remove(),1150);
    }
    function finish(ok,message,rightText=''){
      const f=$('#feedback'), th=$('#theory'), card=$('#taskCard');
      card.classList.remove('correct','wrong'); card.classList.add(ok?'correct':'wrong');
      playAnswerEffect(ok);
      setSessionStatus(ok?'correct':'wrong');
      if(!ok) setSavedTaskStatus('wrong');
      f.innerHTML=`<span class="${ok?'good':'bad'}">${message}</span>`;
      th.innerHTML=`<div class="answer-line"><b>Ответ:</b> ${rich(rightText || answerText())}</div><div class="answer-line"><b>Подсказка:</b> ${rich(currentHint())}</div>`;
      th.classList.remove('hidden');
      if(!ok) return;
      markDone(); lockTask();
      if(!$('#nextBtn')){
        const last=state.index===state.taskOrder.length-1;
        $('#controlsRow')?.insertAdjacentHTML('afterend',`<button id="nextBtn" class="btn" style="margin-top:14px" onclick="nextTask()">${last?'Завершить раздел':'Следующее задание'} →</button>`);
      }
    }
    function checkChoose(){
      const t=currentTask(); if(state.selectedOption===null) return requestAnswer('Сначала выберите вариант ответа.');
      const ok=state.selectedOption===Number(t.answer), selected=$(`[data-option="${state.selectedOption}"]`);
      selected?.classList.add(ok?'correct':'wrong');
      finish(ok,ok?'Правильно!':'Не совсем.',(t.options||[])[t.answer]||'');
    }
    function correctSelectNumbers(t){
      const items=t.items||[];
      const marked=items.map((item,i)=>item && item.is_correct===true ? i+1 : null).filter(Boolean);
      if(marked.length) return marked;
      const answer=Array.isArray(t.answers) ? t.answers[0] : t.answer;
      return String(answer ?? '').match(/\d+/g)?.join('').split('').map(Number).filter(n=>n>=1 && n<=items.length) || [];
    }
    function checkSelect(){
      const t=currentTask();
      if(!state.selectedSelectItems.length) return requestAnswer('Сначала выберите утверждения.');
      const selected=state.selectedSelectItems.map(i=>i+1).sort((a,b)=>a-b);
      const right=correctSelectNumbers(t).sort((a,b)=>a-b);
      const ok=selected.length===right.length && selected.every((value,i)=>value===right[i]);
      $$('[data-select-index]').forEach(b=>{
        const number=Number(b.dataset.selectIndex)+1;
        if(right.includes(number)) b.classList.add('correct');
        else if(selected.includes(number)) b.classList.add('wrong');
      });
      finish(ok,ok?'Правильно!':'Не совсем.',right.join(''));
    }
    function selectableWords(text){ return String(text||'').split(/\s+/).map(clean).filter(Boolean); }
    function answerWords(answers){ return (answers||[]).flatMap(part=>String(part).split(/\s+/).map(clean).filter(Boolean)); }
    function sameWords(a,b){ const left=[...a].sort(), right=[...b].sort(); return left.length===right.length && left.every((v,i)=>v===right[i]); }
    function answerVariants(answers){
      const values=Array.isArray(answers) ? answers : (answers ? [answers] : []);
      if(!values.length) return [[]];
      const variants=values.map(value=>answerWords([value]));
      if(values.length>1) variants.push(answerWords(values));
      return variants;
    }
    function checkHighlight(){
      const t=currentTask(), entries=Object.entries(state.highlightMarks);
      if(!entries.length) return requestAnswer('Сначала разметьте нужные слова.');
      const words=selectableWords(t.text), marking=expectedMarking(t), roles=['subject','predicate','main'];
      const ok=roles.every(role=>{
        const selected=entries.filter(([,value])=>value===role).map(([i])=>words[Number(i)]).filter(Boolean);
        return answerVariants(marking[role]).some(variant=>sameWords(selected,variant));
      });
      const labels={subject:'подлежащее',predicate:'сказуемое',main:'главный член'};
      const right=roles.filter(role=>(marking[role]||[]).length).map(role=>`${labels[role]}: ${(marking[role]||[]).join(' / ')}`).join('; ');
      finish(ok,ok?'Разметка верна!':'Проверьте слова и типы линий.',right);
    }
    function checkClassify(){
      const t=currentTask(); if(state.selectedCategory===null) return requestAnswer('Сначала выберите категорию.');
      const ok=state.selectedCategory===t.answer;
      const selected=[...$$('[data-cat-index]')].find(b=>state.classifyCategories[Number(b.dataset.catIndex)]===state.selectedCategory);
      selected?.classList.add(ok?'correct':'wrong');
      finish(ok,ok?'Правильно!':'Не совсем.',t.answer||'');
    }
    function checkSort(){
      const t=currentTask(), items=t.items||[];
      if(Object.keys(state.sortPlaced).length<items.length) return requestAnswer('Сначала разложите все карточки по корзинкам.');
      const ok=items.every((it,i)=>state.sortPlaced['i'+i]===it.answer);
      finish(ok,ok?'Всё разложено верно!':'Есть ошибки в корзинках. Попробуйте ещё раз.');
    }
    function checkMatch(){
      const t=currentTask(), pairs=t.pairs||[], rights=state.matchRightOptions;
      if(Object.keys(state.matchLinks).length<pairs.length) return requestAnswer('Сначала соедините все пары.');
      const right=pairs.reduce((n,p,i)=>n+(rights[state.matchLinks[i]]===pairAnswer(p)?1:0),0), ok=right===pairs.length;
      finish(ok,ok?'Всё соединено верно!':`Верно ${right}/${pairs.length}. Попробуйте ещё раз.`);
    }
    function checkInput(){
      const t=currentTask(), input=$('#answerInput'), value=inputValue(input?.value);
      if(!value) return requestAnswer('Сначала введите ответ.');
      const answers=Array.isArray(t.answers)?t.answers:(t.answer!==undefined?[t.answer]:[]);
      const ok=answers.some(answer=>inputValue(answer)===value);
      finish(ok,ok?'Правильно!':'Не совсем.',answers.join(' / '));
    }
    function showHint(){
      const section=(state.data.subtopics||{})[state.subtopic]||{};
      const title=stripEmoji(section.title||'Теория раздела'), text=section.theory||'Теория раздела пока не добавлена.';
      const image=section.theoryImage || section.theory_image || section.image || theoryImages[state.subtopic];
      closeTheory(false); theoryReturnFocus=document.activeElement;
      const overlay=document.createElement('div');
      overlay.className='theory-overlay'; overlay.setAttribute('role','presentation');
      const body=image
        ? `<button class="theory-image-button" type="button" aria-label="Увеличить картинку теории" title="Увеличить" onclick="toggleTheoryImageZoom(this)"><img src="${esc(assetUrl(image))}" alt="${esc(title)}"></button>`
        : `<p>${rich(text)}</p>`;
      overlay.innerHTML=`<section class="theory-sheet ${image?'has-image':''}" role="dialog" aria-modal="true" aria-labelledby="theorySheetTitle"><button class="theory-close" type="button" aria-label="Закрыть теорию">×</button><h2 class="theory-sheet-title" id="theorySheetTitle">${esc(title)}</h2><div class="theory-sheet-body">${body}</div></section>`;
      overlay.addEventListener('click',event=>{ if(event.target===overlay) closeTheory(); });
      overlay.querySelector('.theory-close').addEventListener('click',()=>closeTheory());
      document.body.appendChild(overlay); overlay.querySelector('.theory-close').focus();
    }
    function toggleTheoryImageZoom(button){ button.classList.toggle('zoomed'); }
    function closeTheory(restoreFocus=true){
      const overlay=document.querySelector('.theory-overlay'); if(!overlay) return;
      overlay.remove();
      if(restoreFocus && theoryReturnFocus?.isConnected) theoryReturnFocus.focus();
      theoryReturnFocus=null;
    }
    function nextTask(){ if(!state.locked) return; state.index++; renderTask(); }
    function skipTask(){
      if(state.locked) return;
      if(sessionStatus()!=='wrong') setSessionStatus('skipped');
      if(savedTaskStatus(state.subtopic,sourceIndex())!=='wrong') setSavedTaskStatus('skipped');
      state.index++;
      renderTask();
    }
    function retryMissedTasks(){
      const order=retryIndexes();
      if(!order.length) return renderComplete();
      startSession(order);
    }
    function completionMedals(){
      const current=(state.data.subtopics||{})[state.subtopic]||{};
      const order=state.data.subtopicOrder || Object.keys(state.data.subtopics || {});
      let ids=order.filter(id=>(state.data.subtopics[id]||{}).parent===current.parent);
      if(ids.length<5) ids=[...ids,...order.filter(id=>!ids.includes(id))].slice(0,5);
      return `<div class="completion-medals" aria-hidden="true">${ids.slice(0,5).map(id=>{
        const cfg=state.data.subtopics[id]||{}, p=progressFor(id), done=p.total>0 && p.done===p.total;
        const icon=sectionIcons[id]||'icon_lion.png';
        const image=done ? iconImg(icon,cfg.animal||stripEmoji(cfg.title||id),'') : '';
        return `<span class="completion-medal ${done?'done':''}">${image}</span>`;
      }).join('')}</div>`;
    }
    function renderComplete(){
      const cfg=state.data.subtopics[state.subtopic]||{}, assets=sectionAssets[state.subtopic]||sectionAssets.train;
      const p=progressFor(state.subtopic), completed=p.total>0 && p.done===p.total;
      const stats=statsFor(state.subtopic), totalStats=overallStats(), missed=retryIndexes();
      const text=completed
        ? 'Все задания выполнены правильно — персонаж поселился на карточке раздела!'
        : 'Раздел ещё не закрыт: отработайте пропущенные и неверные задания.';
      const character=completed?`<img class="completion-character" src="${esc(assetUrl(assets.character))}" alt="${esc(cfg.animal||'Персонаж раздела')}">`:'';
      const retryButton=missed.length?`<button class="btn" onclick="retryMissedTasks()">Отработать ошибки (${missed.length})</button>`:'';
      const demoOffer=DEMO_MODE?`<p><b>Демо-версия завершена: доступно 20 заданий.</b></p><button class="btn" onclick="location.href='/shop/grammar-zoo'">Купить полный комплект</button>`:'';
      render(`<div class="tools"><button class="btn secondary small" onclick="renderMap()">← На карту</button></div><div class="completion-panel">${character}${completionMedals()}<h2>${esc(stripEmoji(cfg.title||'Раздел'))}</h2><p>${text}</p>${demoOffer}<div class="stats-row"><div class="stat-pill good">Верно: ${stats.correct}/${stats.total}</div><div class="stat-pill bad">Неверно: ${stats.wrong}</div><div class="stat-pill skip">Пропущено: ${stats.skipped}</div></div><p class="muted">Всего по игре: верно ${totalStats.correct}/${totalStats.total}, ошибок ${totalStats.wrong}, пропущено ${totalStats.skipped}</p><div class="row" style="justify-content:center">${retryButton}<button class="btn secondary" onclick="renderMap()">На карту</button></div></div>`);
    }
    function resetProgress(){ if(confirm('Сбросить прогресс?')){ state.progress={}; save(); renderMap(); } }
    window.openSubtopic=openSubtopic; window.renderMap=renderMap; window.resetProgress=resetProgress;
    window.selectOption=selectOption; window.toggleSelectItem=toggleSelectItem; window.setMarkRole=setMarkRole; window.toggleHighlight=toggleHighlight; window.selectCategory=selectCategory;
    window.selectSortItem=selectSortItem; window.dragSortItem=dragSortItem; window.placeSortItem=placeSortItem; window.dropSortItem=dropSortItem;
    window.selectMatchLeft=selectMatchLeft; window.selectMatchRight=selectMatchRight;
    window.previewMatchLine=previewMatchLine; window.hidePreviewLine=hidePreviewLine;
    window.checkChoose=checkChoose; window.checkSelect=checkSelect; window.checkHighlight=checkHighlight; window.checkClassify=checkClassify;
    window.checkSort=checkSort; window.checkMatch=checkMatch; window.checkInput=checkInput;
    window.showHint=showHint; window.toggleTheoryImageZoom=toggleTheoryImageZoom; window.nextTask=nextTask; window.skipTask=skipTask; window.startSession=startSession; window.retryMissedTasks=retryMissedTasks; window.goToTask=goToTask; window.revealAnswer=revealAnswer;
    document.addEventListener('keydown',event=>{ if(event.key==='Escape' && document.querySelector('.theory-overlay')) closeTheory(); });
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
