 ${d.teacherImport?.length?`<strong>Файл: ${esc(d.teacherImportName)} · найдено ${d.teacherImport.length}, без замечаний к формату ${d.teacherImport.filter(entry=>!entry.error).length}</strong><div class="duel-import-preview">${d.teacherImport.map((entry,i)=>`<label class="duel-import-row ${entry.error?'invalid':''}"><input type="checkbox" data-duel-import-select="${i}" ${entry.selected?'checked':''} ${entry.error?'disabled':''}><span><b>${esc(entry.word)}</b> <code>${esc(entry.pieces.join(' '))}</code>${entry.error?`<br><em>Строка ${entry.line}: ${esc(entry.error)}</em>`:''}</span></label>`).join('')}</div>`:''}
 </section><section class="duel-import-area"><h3>Добавить одно слово вручную</h3><label>Слово<input name="word" value="${esc(d.teacherDraftWord||'')}" placeholder="переобучение"></label><label>Морфемы по порядку<input name="parts" value="${esc(d.teacherDraftParts||'')}" placeholder="P:пере P:об R:уч S:ени E:е"></label><small>Обозначения: P приставка, R корень, S суффикс, E окончание, Z нулевое окончание, F суффикс формы, T постфикс, C соединительная гласная.</small></section>
 <label>Код учителя<input name="code" type="password" autocomplete="off" placeholder="Введите код перед добавлением"></label>${d.teacherError?`<span class="duel-form-error" role="alert">${esc(d.teacherError)}</span>`:''}${d.teacherImportSuccess?`<span role="status">${esc(d.teacherImportSuccess)}</span>`:''}<div class="duel-form-buttons">${d.teacherImport?.some(entry=>entry.selected&&!entry.error)?'<button type="button" class="btn primary" data-duel-import-commit>Добавить отмеченные из .txt</button>':''}<button type="submit" class="btn">Добавить слово вручную</button><button type="button" class="btn primary" data-duel-teacher-write>Записать словарь в этот HTML</button><button type="button" class="btn" data-duel-teacher-export>Скачать копию, если запись недоступна</button><button type="button" class="btn" data-duel-teacher-close>Закрыть</button></div></form></div></div>`:''}
 </div><div class="duel-footer"><button type="button" class="btn ghost" data-duel-rules>Правила игры</button><button type="button" class="btn ghost" data-game-start="parse">Новая партия</button><button type="button" class="btn ghost" data-duel-teacher-open>⚙ Настройки словаря</button>${d.partyWords.length?`<button type="button" class="btn ghost" data-duel-party-download>Скачать .txt (${d.partyWords.length})</button>`:saved.lastPartyWords?.length?`<button type="button" class="btn ghost" data-duel-party-download data-archive="1">Скачать прошлый .txt (${saved.lastPartyWords.length})</button>`:''}<span>${d.turn} из ${d.maxTurns} пар ходов</span><span>Проверенные словообразовательные гнёзда</span></div></div>`
}
function duelBind(){let d=state.game?.duel;if(state.page!=='game'||state.game?.id!=='parse'||!d)return;
 document.querySelectorAll('[data-duel-add]').forEach(el=>{let source=el.dataset.duelAdd,id=el.dataset.duelId,index=Number(el.dataset.duelIndex),press;
  el.onclick=e=>{if(el.dataset.suppressClick){delete el.dataset.suppressClick;return}if(e.target.closest('.duel-variant-sign')&&!d.exchangeMode){duelOpenVariantMenu(el,source,id,index);return}duelAdd(source,id,index)};
  el.oncontextmenu=e=>{if(duelVariants(id).length<2)return;e.preventDefault();duelOpenVariantMenu(el,source,id,index)};
  el.onpointerdown=e=>{if(!d.exchangeMode&&e.pointerType==='touch'&&duelVariants(id).length>1)press=setTimeout(()=>{el.dataset.suppressClick='1';duelOpenVariantMenu(el,source,id,index)},550)};
  el.onpointerup=el.onpointercancel=el.onpointerleave=()=>clearTimeout(press);
  el.ondragstart=e=>{if(el.disabled||d.exchangeMode){e.preventDefault();return}e.dataTransfer.setData('text/plain',JSON.stringify({source,id,index}))}
 });
 let bench=document.querySelector('.duel-assembly');if(bench){bench.ondragover=e=>{e.preventDefault();bench.classList.add('drop-active')};bench.ondragleave=()=>bench.classList.remove('drop-active');bench.ondrop=e=>{e.preventDefault();bench.classList.remove('drop-active');try{let tile=JSON.parse(e.dataTransfer.getData('text/plain'));duelAdd(tile.source,tile.id,tile.index)}catch{}}}
 document.querySelectorAll('[data-duel-remove]').forEach(el=>{let index=Number(el.dataset.duelRemove),id=d.assembly[index]?.id;el.onclick=e=>{if(e.target.closest('.duel-variant-sign'))duelOpenVariantMenu(el,'assembly',id,index);else duelRemove(index)};el.oncontextmenu=e=>{if(duelVariants(id).length<2)return;e.preventDefault();duelOpenVariantMenu(el,'assembly',id,index)}});
 document.querySelectorAll('[data-duel-submit]').forEach(el=>el.onclick=duelSubmit);
 document.querySelectorAll('[data-duel-party-add]').forEach(el=>el.onclick=duelAddParty);
 document.querySelectorAll('[data-duel-party-download]').forEach(el=>el.onclick=()=>duelDownloadParty(el.dataset.archive==='1'));
 document.querySelectorAll('[data-duel-teacher-open]').forEach(el=>el.onclick=duelOpenTeacher);
 document.querySelectorAll('[data-duel-teacher-close]').forEach(el=>el.onclick=()=>{d.teacherOpen=false;d.teacherError='';render()});
 document.querySelectorAll('[data-duel-teacher-write]').forEach(el=>el.onclick=()=>duelWriteTeacherGame(el.closest('form')));
 document.querySelectorAll('[data-duel-teacher-export]').forEach(el=>el.onclick=()=>duelExportTeacherGame(el.closest('form')));
 document.querySelectorAll('[data-duel-teacher-form]').forEach(el=>el.onsubmit=e=>{e.preventDefault();duelSaveTeacher(el)});
 document.querySelectorAll('[data-duel-teacher-import]').forEach(el=>el.onchange=()=>duelLoadTeacherTxt(el.files?.[0]));
 document.querySelectorAll('[data-duel-import-select]').forEach(el=>el.onchange=()=>{let entry=d.teacherImport?.[Number(el.dataset.duelImportSelect)];if(entry&&!entry.error)entry.selected=el.checked});
 document.querySelectorAll('[data-duel-import-commit]').forEach(el=>el.onclick=()=>duelCommitTeacherTxt(el.closest('form')));
 document.querySelectorAll('[data-duel-clear]').forEach(el=>el.onclick=duelClear);
 document.querySelectorAll('[data-duel-exchange]').forEach(el=>el.onclick=duelExchange);
 document.querySelectorAll('[data-duel-hint]').forEach(el=>el.onclick=duelHint);
 document.querySelectorAll('[data-duel-exchange-cancel]').forEach(el=>el.onclick=duelCancelExchange);
 document.querySelectorAll('[data-duel-mode]').forEach(el=>el.onclick=()=>{if(state.game.phase!=='rules'||d.started)return;d.mode=el.dataset.duelMode;saved.duelMode=d.mode;persist();render()});
 document.querySelectorAll('[data-duel-continue]').forEach(el=>el.onclick=duelContinue);
 document.querySelectorAll('[data-duel-help]').forEach(el=>el.onclick=()=>{let field=document.getElementById('duelField'),old=field.querySelector('.duel-help');if(old){old.remove();return}let help=document.createElement('div');help.className='duel-help';help.innerHTML='<strong>Как играть</strong><p>Нажимайте плитки по порядку: со стола, из руки и из бокового банка. Значок ↔ открывает варианты, например снег/снеж. Затем нажмите «Построить слово». Подсказка показывает одно доступное слово и сразу снимает один балл, повторно в этот ход балл не снимается. Для обмена отметьте ровно три плитки на руке. Новое слово вне словаря можно предложить учителю, но оно не приносит очков и не тратит ход.</p><button type="button" class="btn">Понятно</button>';field.appendChild(help);help.querySelector('button').onclick=()=>help.remove()});
}

function render(){document.getElementById('main').innerHTML=duelScene();duelBind();
 document.querySelectorAll('[data-game-begin]').forEach(el=>el.onclick=()=>{state.game.duel.started=true;state.game.phase='play';render()});
 document.querySelectorAll('[data-game-start]').forEach(el=>el.onclick=()=>newParty());
 document.querySelectorAll('[data-duel-rules]').forEach(el=>el.onclick=()=>{state.game.phase='rules';render()});
}
function newParty(){state.game={id:'parse',phase:'rules'};duelInit(state.game);render()}
newParty();
</script></body></html>
