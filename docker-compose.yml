services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ege-platform
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      PORT: "8088"
      HOST: "0.0.0.0"
      SECRET_KEY: "${SECRET_KEY:-change-me}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8088}"
      ADMIN_LOGIN: "${ADMIN_LOGIN:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SEED_DEMO_USERS: "${SEED_DEMO_USERS:-0}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-true}"
      YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
      YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
      BERRY_SEASON_PRODUCT_URL: "${BERRY_SEASON_PRODUCT_URL:-}"
    volumes:
      - ege_platform_data:/app/data
    networks:
      - ege_platform_net

volumes:
  ege_platform_data:
    external: true
    name: 9-ege-docker-compose_ege_platform_data

networks:
  ege_platform_net:
    driver: bridge
